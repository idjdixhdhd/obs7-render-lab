name: render-test

on:
  push:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: |
          pip install numpy pillow
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk > /dev/null
          nproc; free -h | head -2
      - name: Render test clip
        run: python render_test.py
      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: render-output
          path: out/
